server {
    listen 80;
    server_name _;

    # Serve frontend static files
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Proxy SRS WHIP/WHEP API
    location /rtc/v1/ {
        proxy_pass http://srs:1985/rtc/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Proxy SRS HTTP API
    location /api/v1/ {
        proxy_pass http://srs:1985/api/v1/;
        proxy_set_header Host $host;
    }

    # Proxy Signaling server (Socket.IO)
    location /socket.io/ {
        proxy_pass http://signaling:3000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_cache_bypass $http_upgrade;
    }

    # Proxy Signaling REST API
    location /signaling/ {
        proxy_pass http://signaling:3000/;
        proxy_set_header Host $host;
    }
}
