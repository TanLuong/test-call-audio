version: "3.9"

services:
  srs:
    image: ossrs/srs:5
    container_name: srs
    restart: unless-stopped
    environment:
      CANDIDATE: ${CANDIDATE}
    ports:
      - "8000:8000/udp"   # WebRTC media (must be direct, no Cloudflare proxy)
    expose:
      - "1985"            # HTTP API (internal, proxied via nginx)
      - "8080"            # Web console (internal)

  signaling:
    build: ./signaling
    container_name: signaling
    restart: unless-stopped
    expose:
      - "3000"

  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./web:/usr/share/nginx/html:ro
    depends_on:
      - srs
      - signaling
